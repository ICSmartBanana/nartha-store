name: Sync catalogue from Shopify
on:
  schedule: [{ cron: "30 20 * * *" }]   # 02:00 IST daily
  workflow_dispatch:
permissions: { contents: write }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/sync.py
      - run: |
          git config user.name "catalog-bot"; git config user.email "catalog-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Sync catalogue from nartha.in" && git push)
